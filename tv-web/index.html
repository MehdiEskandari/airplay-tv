<!doctype html>
<html lang="fa" dir="rtl" data-theme="teli_dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>AirPlay TV</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <object id="av-player" type="application/avplayer"></object>
  <video id="receiver-video" playsinline></video>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      function start() { var app=document.createElement('script');app.src='app.js';document.body.appendChild(app); }
      if(window.tizen) {
        var sdk=document.createElement('script');sdk.src='$WEBAPIS/webapis/webapis.js';
        sdk.onload=start;sdk.onerror=start;document.head.appendChild(sdk);
      } else start();
    })();
  </script>
</body>
</html>
