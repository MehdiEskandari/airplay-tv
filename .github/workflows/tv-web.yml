name: TV web interface
on:
  push:
    paths: ['tv-web/**', 'platforms/tizen/**', 'platforms/samsung-legacy/**', 'app/src/main/res/**', '.github/workflows/tv-web.yml']
  pull_request:
    paths: ['tv-web/**', 'platforms/tizen/**', 'platforms/samsung-legacy/**', 'app/src/main/res/**', '.github/workflows/tv-web.yml']
jobs:
  web-and-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tv-web/package-lock.json
      - run: npm ci
        working-directory: tv-web
      - run: npm test && npm run build
        working-directory: tv-web
      - run: python3 platforms/tizen/tests/discovery.py
      - run: python3 platforms/samsung-legacy/tests/http_test.py
      - run: python3 platforms/samsung-legacy/scripts/build.py --host 127.0.0.1
