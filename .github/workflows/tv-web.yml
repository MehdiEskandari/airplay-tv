name: webOS interface preview
on:
  push:
    paths: ['tv-web/**', 'platforms/webos/**', 'app/src/main/res/**', '.github/workflows/tv-web.yml']
  pull_request:
    paths: ['tv-web/**', 'platforms/webos/**', 'app/src/main/res/**', '.github/workflows/tv-web.yml']
jobs:
  web-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tv-web/package-lock.json
      - run: npm ci
        working-directory: tv-web
      - run: npm test
        working-directory: tv-web
      - run: npm run package:webos
        working-directory: tv-web
      - run: python3 platforms/webos/tests/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: airplay-tv-webos-interface-preview
          path: platforms/webos/output/*.ipk
